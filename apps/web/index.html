<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Referência não oficial para Fabula Ultima, de uso privado."
    />
    <title>Códice do Cristal</title>
    <script>
      // Sets the theme before first paint so there is no flash. Keep the
      // storage key in sync with src/lib/theme.ts.
      (function () {
        try {
          var theme = localStorage.getItem('codice-tema');
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
