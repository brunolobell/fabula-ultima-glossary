services:
  db:
    image: postgres:16-alpine
    container_name: fug-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fug
      POSTGRES_PASSWORD: fug
      POSTGRES_DB: fabula_glossary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fug -d fabula_glossary"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
